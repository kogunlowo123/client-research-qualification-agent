name: Bug report
description: Report incorrect behavior, a crash or a bad brief
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens or confidential client data. Report
        security vulnerabilities privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the command or job, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cra research --company "..." --ticker ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [local, dev, staging, prod]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, MLflow trace ID or job run URL
      render: shell

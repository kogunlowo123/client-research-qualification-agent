version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    groups:
      databricks:
        patterns: ["databricks-*", "mlflow*"]
      opentelemetry:
        patterns: ["opentelemetry-*"]
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "bandit", "pip-audit", "hypothesis", "respx", "types-*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, docker]

  - package-ecosystem: terraform
    directory: /deployment/terraform
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, terraform]

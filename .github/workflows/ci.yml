name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.7"
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install toolchain
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          uv pip install --no-deps -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .
      - name: shellcheck
        run: shellcheck deployment/workflows/*.sh
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=deployment/terraform fmt -check -recursive
      - name: terraform validate
        run: |
          terraform -chdir=deployment/terraform init -backend=false -input=false
          terraform -chdir=deployment/terraform validate

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          uv pip install --no-deps -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: mypy
        run: mypy

  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install -r requirements-dev.txt
          uv pip install --no-deps -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: pytest (unit, coverage gate 90%)
        run: >-
          pytest tests/unit
          --cov --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
          --cov-fail-under=90
          --junitxml=junit-unit.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/
            junit-unit.xml
          retention-days: 14
          if-no-files-found: warn

  integration-tests:
    name: Integration, e2e, contract, RAG eval and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          uv pip install --no-deps -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: pytest (marked suites)
        run: >-
          pytest
          -m "integration or e2e or contract or rag_eval or security"
          --junitxml=junit-integration.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: junit-integration.xml
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
          uv pip install --no-deps -e .
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: bandit (SAST)
        run: bandit -c pyproject.toml -r src
      - name: pip-audit (dependency CVEs)
        run: pip-audit --strict --disable-pip --no-deps -r requirements-dev.txt
      - name: safety scan
        if: env.SAFETY_API_KEY != ''
        run: uvx --from safety safety scan --detailed-output
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build wheel, sdist and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, unit-tests]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel and sdist
        run: uv build --out-dir dist
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif
      - name: Upload Trivy image SARIF
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  publish:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, integration-tests, security]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Verify tag matches package version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          [[ "v${version}" == "${GITHUB_REF_NAME}" ]] || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          }
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true

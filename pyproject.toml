[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "client-research-qualification-agent"
version = "1.0.0"
description = "Enterprise Client Research & Qualification Agent on Databricks: agentic RAG over public company evidence producing cited, scored client briefs."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Kehinde Ogunlowo" }]
keywords = ["databricks", "mosaic-ai", "rag", "agents", "mlflow", "llmops"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "tenacity>=8.3",
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "python-dateutil>=2.9",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
databricks = [
    "databricks-sdk>=0.30",
    "databricks-vectorsearch>=0.40",
    "mlflow>=2.17",
    "openai>=1.40",
    "databricks-agents>=1.0",
]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=4.0",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
    "bandit[toml]>=1.7.9",
    "pip-audit>=2.7",
]

[project.scripts]
cra = "client_research_agent.cli:main"
cra-ingest = "client_research_agent.workflows.ingest_job:main"
cra-brief = "client_research_agent.workflows.brief_job:main"
cra-evaluate = "client_research_agent.workflows.evaluation_job:main"
cra-deploy-agent = "client_research_agent.workflows.deploy_agent_job:main"

[tool.hatch.build.targets.wheel]
packages = ["src/client_research_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF", "PL", "PT", "N", "ANN"]
ignore = ["PLR0913", "PLR2004", "ANN401", "PLR0911", "PLR0912"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106", "PLC0415"]
"deployment/**" = ["ANN", "INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["client_research_agent"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "databricks.*", "mlflow.*", "tiktoken.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires wiring multiple real components (no network)",
    "e2e: full pipeline run against local adapters",
    "databricks: requires a live Databricks workspace (DATABRICKS_HOST set)",
    "performance: latency/throughput budgets",
    "security: adversarial and policy tests",
    "rag_eval: retrieval and generation quality gates",
    "contract: port/adapter behavioural contract tests",
]

[tool.coverage.run]
source = ["client_research_agent"]
branch = true
omit = ["*/databricks/live_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.bandit]
exclude_dirs = ["tests"]
